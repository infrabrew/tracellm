[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "tracellm"
version = "0.1.0"
description = "LLM inference, training, and fine-tuning platform — like ollama meets vLLM with built-in training"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "TraceLLM Contributors" }]
keywords = ["llm", "inference", "training", "fine-tuning", "mamba", "vllm", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "tokenizers>=0.19.0",
    "safetensors>=0.4.0",
    "accelerate>=0.30.0",
    "peft>=0.11.0",
    "datasets>=2.19.0",
    "huggingface-hub>=0.23.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "psutil>=5.9.0",
    "aiofiles>=23.2.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
deepspeed = ["deepspeed>=0.14.0"]
flashinfer = ["flashinfer>=0.1.0"]
mamba = ["mamba-ssm>=2.0.0", "causal-conv1d>=1.2.0"]
quantize = ["bitsandbytes>=0.43.0", "auto-gptq>=0.7.0", "autoawq>=0.2.0"]
gguf = ["llama-cpp-python>=0.2.70"]
rlhf = ["trl>=0.9.0"]
all = [
    "tracellm[deepspeed,flashinfer,mamba,quantize,gguf,rlhf]",
    "wandb>=0.17.0",
    "tensorboard>=2.16.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
tracellm = "tracellm.cli:main"

[project.urls]
Homepage = "https://github.com/tracellm/tracellm"
Documentation = "https://tracellm.github.io"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B"]
ignore = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
